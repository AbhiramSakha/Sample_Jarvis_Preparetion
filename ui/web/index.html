<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>J.A.R.V.I.S</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--rgb:25,211,255}
body[data-status="listening"]{--rgb:45,255,179}
body[data-status="thinking"]{--rgb:255,179,71}
body[data-status="speaking"]{--rgb:125,249,255}
body[data-status="offline"]{--rgb:255,82,82}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow:hidden}
body{background:#010409;color:#d6f4ff;font-family:'Rajdhani','Segoe UI',system-ui,sans-serif;font-size:17px}

/* ---------- background layers ---------- */
#bg{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.aurora{position:fixed;inset:0;z-index:1;pointer-events:none;
  background:
    radial-gradient(60vmax 40vmax at 15% 20%,rgba(41,98,255,.22),transparent 60%),
    radial-gradient(50vmax 40vmax at 85% 80%,rgba(124,77,255,.18),transparent 60%),
    radial-gradient(40vmax 30vmax at 50% 50%,rgba(var(--rgb),.10),transparent 65%);
  animation:drift 18s ease-in-out infinite alternate}
@keyframes drift{from{transform:scale(1) translate(0,0)}to{transform:scale(1.08) translate(-1.5%,1%)}}
.grid{position:fixed;inset:0;z-index:1;pointer-events:none;
  background-image:linear-gradient(rgba(var(--rgb),.06) 1px,transparent 1px),linear-gradient(90deg,rgba(var(--rgb),.06) 1px,transparent 1px);
  background-size:64px 64px;
  -webkit-mask-image:radial-gradient(circle at 50% 50%,#000 0,transparent 70%);
  mask-image:radial-gradient(circle at 50% 50%,#000 0,transparent 70%)}
.vignette{position:fixed;inset:0;z-index:4;pointer-events:none;background:radial-gradient(circle at 50% 50%,transparent 55%,rgba(0,0,0,.65) 100%)}
.scan{position:fixed;inset:0;z-index:5;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(255,255,255,.015) 0 1px,transparent 1px 3px)}

/* ---------- HUD frame ---------- */
.corner{position:fixed;width:34px;height:34px;z-index:6;border:2px solid rgba(var(--rgb),.55);pointer-events:none}
.corner.tl{top:14px;left:14px;border-right:0;border-bottom:0}
.corner.tr{top:14px;right:14px;border-left:0;border-bottom:0}
.corner.bl{bottom:14px;left:14px;border-right:0;border-top:0}
.corner.br{bottom:14px;right:14px;border-left:0;border-top:0}
header{position:fixed;top:0;left:0;right:0;z-index:6;display:flex;justify-content:space-between;align-items:center;padding:24px 56px}
.brand{display:flex;align-items:center;gap:14px}
.brand i{width:30px;height:30px;border-radius:50%;border:2px solid rgb(var(--rgb));box-shadow:0 0 14px rgba(var(--rgb),.8),inset 0 0 10px rgba(var(--rgb),.6);position:relative}
.brand i::after{content:"";position:absolute;inset:7px;border-radius:50%;background:rgb(var(--rgb));box-shadow:0 0 10px rgb(var(--rgb))}
.brand strong{font-family:'Orbitron',sans-serif;font-size:15px;letter-spacing:.3em;color:#fff}
.brand span{display:block;font-size:11px;letter-spacing:.22em;color:rgba(214,244,255,.45);margin-top:2px}
.meta{text-align:right}
.meta #clock{font-family:'Orbitron',sans-serif;font-size:20px;letter-spacing:.12em;color:#fff;text-shadow:0 0 10px rgba(var(--rgb),.6)}
.meta small{display:block;font-size:12px;letter-spacing:.22em;color:rgba(214,244,255,.5);margin-top:3px;text-transform:uppercase}

/* ---------- the circle ---------- */
.stage{position:fixed;inset:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:70px 16px 190px}
.orb{position:relative;width:min(54vh,520px,88vw);aspect-ratio:1}
.halo{position:absolute;inset:-12%;border-radius:50%;background:radial-gradient(circle,rgba(var(--rgb),.28) 0,rgba(var(--rgb),.08) 45%,transparent 68%);animation:breathe 4s ease-in-out infinite}
body[data-status="listening"] .halo{animation-duration:2s}
body[data-status="speaking"] .halo{animation-duration:1.1s}
@keyframes breathe{0%,100%{transform:scale(.94);opacity:.75}50%{transform:scale(1.06);opacity:1}}
.orb svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.spin-a,.spin-b,.spin-c,.spin-d{transform-origin:0 0}
.spin-a{animation:spin 70s linear infinite}
.spin-b{animation:spin 45s linear infinite reverse}
.spin-c{animation:spin 26s linear infinite}
.spin-d{animation:spin 16s linear infinite reverse}
body[data-status="thinking"] .spin-c{animation-duration:4s}
body[data-status="thinking"] .spin-d{animation-duration:2.6s}
@keyframes spin{to{transform:rotate(360deg)}}
.ring{fill:none;stroke:rgb(var(--rgb))}
.ring.thick{stroke-width:3;stroke-opacity:.95}
.ring.faint{stroke-width:1;stroke-opacity:.4;stroke-dasharray:2 6}
.ring.dashed{stroke-width:1.5;stroke-opacity:.55;stroke-dasharray:3 9}
.tick{stroke:rgb(var(--rgb));stroke-opacity:.5;stroke-width:1.2}
.tick.long{stroke-opacity:.95;stroke-width:2}
.arc{fill:none;stroke:rgb(var(--rgb));stroke-linecap:round}
.bar{stroke:rgb(var(--rgb));stroke-width:3;stroke-linecap:round}
.title{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.title h1{font-family:'Orbitron','Segoe UI',sans-serif;font-weight:800;font-size:clamp(20px,5.2vh,46px);letter-spacing:.32em;padding-left:.32em;color:#fff;
  text-shadow:0 0 12px rgba(var(--rgb),.9),0 0 34px rgba(var(--rgb),.6),0 0 70px rgba(var(--rgb),.35);animation:flicker 7s infinite}
.title small{margin-top:.9em;font-family:'Orbitron',sans-serif;font-size:clamp(8px,1.3vh,11px);letter-spacing:.5em;padding-left:.5em;color:rgba(var(--rgb),.9)}
@keyframes flicker{0%,92%,100%{opacity:1}93%{opacity:.8}94%{opacity:1}96%{opacity:.9}}

.status{margin-top:clamp(14px,3vh,34px);text-align:center}
.status b{display:inline-flex;align-items:center;gap:.8em;font-family:'Orbitron',sans-serif;font-weight:600;font-size:clamp(11px,1.8vh,15px);letter-spacing:.42em;color:rgb(var(--rgb));text-shadow:0 0 14px rgba(var(--rgb),.7)}
.status b::before{content:"";width:8px;height:8px;border-radius:50%;background:rgb(var(--rgb));box-shadow:0 0 12px rgb(var(--rgb));animation:blink 1.4s infinite}
.status p{margin-top:.6em;font-size:.85em;letter-spacing:.18em;color:rgba(214,244,255,.45);text-transform:uppercase;min-height:1.2em}
@keyframes blink{50%{opacity:.25}}

/* ---------- conversation dock ---------- */
.dock{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);width:min(780px,calc(100vw - 32px));z-index:6}
.log{display:flex;flex-direction:column;gap:8px;height:140px;overflow:hidden;justify-content:flex-end;margin-bottom:12px;
  -webkit-mask-image:linear-gradient(to top,#000 55%,transparent);mask-image:linear-gradient(to top,#000 55%,transparent)}
.msg{max-width:88%;padding:8px 14px;border-radius:12px;line-height:1.3;border:1px solid rgba(var(--rgb),.25);background:rgba(8,24,44,.55);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);animation:rise .35s ease}
.msg.user{align-self:flex-end;border-color:rgba(255,255,255,.14);background:rgba(255,255,255,.06)}
.msg.jarvis{align-self:flex-start}
.msg em{display:block;font-style:normal;font-family:'Orbitron',sans-serif;font-size:9px;letter-spacing:.3em;color:rgb(var(--rgb));margin-bottom:3px}
.msg.user em{color:rgba(255,255,255,.5)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.cmd{display:flex;align-items:center;gap:10px;padding:6px 6px 6px 20px;border-radius:999px;background:rgba(6,18,34,.7);border:1px solid rgba(var(--rgb),.4);
  box-shadow:0 0 28px rgba(var(--rgb),.16),inset 0 0 18px rgba(var(--rgb),.05);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.cmd .prompt{color:rgb(var(--rgb));font-family:'Orbitron',sans-serif;font-size:14px}
.cmd input{flex:1;background:transparent;border:0;outline:0;color:#fff;font:500 17px 'Rajdhani','Segoe UI',sans-serif;letter-spacing:.04em}
.cmd input::placeholder{color:rgba(214,244,255,.35)}
.cmd button{border:0;cursor:pointer;padding:11px 24px;border-radius:999px;font:700 11px 'Orbitron',sans-serif;letter-spacing:.25em;color:#021018;
  background:linear-gradient(135deg,rgb(var(--rgb)),rgba(var(--rgb),.6));box-shadow:0 0 18px rgba(var(--rgb),.5)}
.cmd button:hover{filter:brightness(1.15)}

/* ---------- boot screen + confirm popup ---------- */
.boot{position:fixed;inset:0;z-index:20;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;
  background:radial-gradient(circle at 50% 50%,#04142a,#01040a 70%);transition:opacity .9s ease,visibility .9s}
.boot.hide{opacity:0;visibility:hidden}
.boot h2{font-family:'Orbitron',sans-serif;font-weight:800;font-size:clamp(28px,7vw,64px);letter-spacing:.4em;padding-left:.4em;color:#fff;
  text-shadow:0 0 16px rgba(var(--rgb),.9),0 0 50px rgba(var(--rgb),.5)}
.boot p{margin-top:24px;font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:.5em;padding-left:.5em;color:rgb(var(--rgb));animation:blink 1.6s infinite}
.boot .load{margin-top:28px;width:220px;height:2px;background:rgba(var(--rgb),.2);overflow:hidden}
.boot .load::after{content:"";display:block;height:100%;width:40%;background:rgb(var(--rgb));box-shadow:0 0 12px rgb(var(--rgb));animation:slide 1.4s ease-in-out infinite}
@keyframes slide{from{transform:translateX(-100%)}to{transform:translateX(260%)}}
.modal{position:fixed;inset:0;z-index:15;display:none;align-items:center;justify-content:center;background:rgba(1,6,14,.6);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.modal.show{display:flex}
.modal .card{width:min(440px,90vw);padding:26px;border-radius:18px;border:1px solid rgba(var(--rgb),.5);background:rgba(6,18,34,.92);box-shadow:0 0 50px rgba(var(--rgb),.25);text-align:center}
.modal h3{font-family:'Orbitron',sans-serif;font-size:12px;letter-spacing:.35em;color:rgb(var(--rgb));margin-bottom:12px}
.modal p{font-size:18px;margin-bottom:20px;word-break:break-word}
.modal .row{display:flex;gap:12px;justify-content:center}
.modal button{border:1px solid rgba(var(--rgb),.6);cursor:pointer;padding:11px 28px;border-radius:999px;font:700 11px 'Orbitron',sans-serif;letter-spacing:.25em;color:#fff;background:transparent}
.modal button.yes{background:rgb(var(--rgb));color:#021018}
</style>
</head>
<body data-status="idle">
<canvas id="bg"></canvas>
<div class="aurora"></div><div class="grid"></div><div class="vignette"></div><div class="scan"></div>
<div class="corner tl"></div><div class="corner tr"></div><div class="corner bl"></div><div class="corner br"></div>

<header>
  <div class="brand"><i></i><div><strong>J.A.R.V.I.S</strong><span>PERSONAL AI SYSTEM</span></div></div>
  <div class="meta"><div id="clock">--:--:--</div><small id="date"></small><small id="model"></small></div>
</header>

<main class="stage">
  <div class="orb">
    <div class="halo"></div>
    <svg viewBox="-300 -300 600 600" aria-hidden="true">
      <defs>
        <radialGradient id="coreFill" cx="50%" cy="50%" r="50%">
          <stop offset="0%" style="stop-color:rgb(var(--rgb));stop-opacity:.32"/>
          <stop offset="70%" style="stop-color:#02101f;stop-opacity:.85"/>
          <stop offset="100%" style="stop-color:#010812;stop-opacity:.95"/>
        </radialGradient>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="3" result="b"/>
          <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
        </filter>
      </defs>
      <g class="spin-a" id="ticks"></g>
      <g class="spin-b"><circle r="252" class="ring dashed"/></g>
      <g class="spin-c" id="arcsA" filter="url(#glow)"></g>
      <g class="spin-d" id="arcsB" filter="url(#glow)"></g>
      <g id="bars"></g>
      <circle r="150" class="ring thick" filter="url(#glow)"/>
      <circle r="143" fill="url(#coreFill)"/>
      <circle r="120" class="ring faint"/>
    </svg>
    <div class="title"><h1>JARVIS</h1><small>AI CORE</small></div>
  </div>
  <div class="status"><b id="statusText">STANDING BY</b><p id="hint"></p></div>
</main>

<div class="dock">
  <div class="log" id="log"></div>
  <form class="cmd" id="form">
    <span class="prompt">&rsaquo;</span>
    <input id="inp" autocomplete="off" placeholder="Type a command, or say “Jarvis…”">
    <button type="submit">SEND</button>
  </form>
</div>

<div class="modal" id="modal">
  <div class="card">
    <h3>CONFIRMATION REQUIRED</h3>
    <p id="confirmText"></p>
    <div class="row"><button class="yes" id="yes">ALLOW</button><button id="no">DENY</button></div>
  </div>
</div>

<div class="boot" id="boot"><h2>JARVIS</h2><p id="bootText">CONNECTING&hellip;</p><div class="load"></div></div>

<script>
const TOKEN = "__TOKEN__";
const $ = s => document.querySelector(s);
const NS = "http://www.w3.org/2000/svg";
const el = (tag, attrs, parent) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); if (parent) parent.appendChild(e); return e; };
const polar = (r, deg) => { const a = (deg - 90) * Math.PI / 180; return [r * Math.cos(a), r * Math.sin(a)]; };
const arcPath = (r, a0, a1) => { const [x0, y0] = polar(r, a0), [x1, y1] = polar(r, a1); return `M${x0} ${y0} A${r} ${r} 0 ${(a1 - a0) % 360 > 180 ? 1 : 0} 1 ${x1} ${y1}`; };

/* ----- build the circle ----- */
for (let i = 0; i < 120; i++) {
  const long = i % 10 === 0, [x1, y1] = polar(268, i * 3), [x2, y2] = polar(long ? 292 : 281, i * 3);
  el("line", { x1, y1, x2, y2, class: "tick" + (long ? " long" : "") }, $("#ticks"));
}
[[10, 80, 4], [110, 150, 2], [200, 290, 5], [310, 340, 2]].forEach(([a, b, w]) => el("path", { d: arcPath(230, a, b), class: "arc", "stroke-width": w }, $("#arcsA")));
[[0, 40, 2], [90, 130, 3], [180, 230, 2], [270, 320, 3]].forEach(([a, b, w]) => el("path", { d: arcPath(214, a, b), class: "arc", "stroke-width": w, "stroke-opacity": .75 }, $("#arcsB")));

const N = 72, cur = new Array(N).fill(0), bars = [], dir = [];
for (let i = 0; i < N; i++) {
  const deg = i * 360 / N, [x1, y1] = polar(158, deg);
  dir.push(polar(1, deg));
  bars.push(el("line", { x1, y1, x2: x1, y2: y1, class: "bar" }, $("#bars")));
}
function target(i, t, st) {
  const p = i / N * Math.PI * 2;
  if (st === "speaking") return .25 + .75 * Math.abs(Math.sin(t * .007 + i * .55)) * (.55 + .45 * Math.abs(Math.sin(t * .0031 + i * .17)));
  if (st === "listening") return .18 + .5 * Math.abs(Math.sin(t * .011 + i * .8)) * (.4 + .6 * Math.random());
  if (st === "thinking") { const a = (t * .005) % (Math.PI * 2); let d = Math.abs(p - a); d = Math.min(d, Math.PI * 2 - d); return .08 + .92 * Math.max(0, 1 - d / 1.1); }
  if (st === "offline") return .03;
  return .07 + .06 * Math.sin(t * .002 + i * .4);
}

/* ----- AI network background ----- */
const cv = $("#bg"), cx = cv.getContext("2d");
let W, H, DPR, pts = [], mouse = { x: -9999, y: -9999 }, rgb = "25,211,255";
function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  W = cv.width = innerWidth * DPR; H = cv.height = innerHeight * DPR;
  const n = Math.round(Math.min(130, innerWidth * innerHeight / 14000));
  pts = Array.from({ length: n }, () => ({ x: Math.random() * W, y: Math.random() * H, vx: (Math.random() - .5) * .3 * DPR, vy: (Math.random() - .5) * .3 * DPR, r: (Math.random() * 1.4 + .6) * DPR }));
}
addEventListener("resize", resize); resize();
addEventListener("mousemove", e => { mouse.x = e.clientX * DPR; mouse.y = e.clientY * DPR; });
function drawNetwork() {
  cx.clearRect(0, 0, W, H);
  const link = 150 * DPR;
  for (const p of pts) {
    p.x += p.vx; p.y += p.vy;
    if (p.x < 0 || p.x > W) p.vx *= -1;
    if (p.y < 0 || p.y > H) p.vy *= -1;
    const dx = p.x - mouse.x, dy = p.y - mouse.y, d = Math.hypot(dx, dy);
    if (d < 130 * DPR && d > 0) { p.x += dx / d * 1.2; p.y += dy / d * 1.2; }
  }
  cx.lineWidth = DPR * .8;
  for (let i = 0; i < pts.length; i++) for (let j = i + 1; j < pts.length; j++) {
    const d = Math.hypot(pts[i].x - pts[j].x, pts[i].y - pts[j].y);
    if (d < link) { cx.strokeStyle = `rgba(${rgb},${(1 - d / link) * .32})`; cx.beginPath(); cx.moveTo(pts[i].x, pts[i].y); cx.lineTo(pts[j].x, pts[j].y); cx.stroke(); }
  }
  for (const p of pts) { cx.fillStyle = `rgba(${rgb},.8)`; cx.beginPath(); cx.arc(p.x, p.y, p.r, 0, 6.2832); cx.fill(); }
}

/* ----- state from the Python program ----- */
let S = { status: "idle", messages: [], msg_id: 0, confirm: "", browser_speech: false, model: "" };
let offline = false, speaking = false, booted = false, firstLoad = true, lastSpoken = -1;
const rendered = new Set();
const effective = () => offline ? "offline" : speaking ? "speaking" : S.status;

function labels(st) {
  return {
    idle: ["STANDING BY", S.browser_speech ? "Type a command below" : "Say “Jarvis” to wake me"],
    listening: ["LISTENING", "I’m all ears"],
    thinking: ["PROCESSING", "Working on it"],
    speaking: ["SPEAKING", ""],
    offline: ["OFFLINE", "Connection lost. Is the program still running?"]
  }[st];
}
function applyStatus() {
  const st = effective();
  if (document.body.dataset.status !== st) {
    document.body.dataset.status = st;
    rgb = getComputedStyle(document.body).getPropertyValue("--rgb").trim();
    const [a, b] = labels(st);
    $("#statusText").textContent = a; $("#hint").textContent = b;
  }
}
function renderLog() {
  const log = $("#log");
  S.messages.forEach(m => {
    if (rendered.has(m.id)) return;
    rendered.add(m.id);
    const d = document.createElement("div"); d.className = "msg " + m.role;
    const e = document.createElement("em"); e.textContent = m.role === "user" ? "YOU" : "JARVIS";
    const s = document.createElement("span"); s.textContent = m.text;
    d.append(e, s); log.appendChild(d);
  });
  while (log.children.length > 4) log.removeChild(log.firstChild);
}
function pickVoice() {
  const v = speechSynthesis.getVoices().filter(x => /^en/i.test(x.lang));
  const pref = ["UK English Male", "Daniel", "George", "Ryan", "David", "Mark", "Google UK English Male"];
  for (const p of pref) { const f = v.find(x => x.name.includes(p)); if (f) return f; }
  return v[0];
}
function say(text) {
  if (!("speechSynthesis" in window)) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text), v = pickVoice();
  if (v) u.voice = v;
  u.pitch = .9;
  u.onstart = () => { speaking = true; applyStatus(); };
  u.onend = u.onerror = () => { speaking = false; applyStatus(); };
  speechSynthesis.speak(u);
}
function speakNew() {
  const fresh = S.messages.filter(m => m.role === "jarvis" && m.id > lastSpoken);
  lastSpoken = S.msg_id;
  if (fresh.length) say(fresh[fresh.length - 1].text);
}
function dismissBoot() {
  if (booted) return;
  booted = true; $("#boot").classList.add("hide");
  if (S.browser_speech) speakNew();
  setTimeout(() => $("#inp").focus(), 400);
}
async function poll() {
  try { const r = await fetch("/state", { cache: "no-store" }); S = await r.json(); offline = false; }
  catch (e) { offline = true; }
  $("#model").textContent = S.model;
  renderLog();
  $("#modal").classList.toggle("show", !!S.confirm);
  $("#confirmText").textContent = S.confirm;
  if (booted && S.browser_speech && S.msg_id !== lastSpoken) speakNew();
  applyStatus();
  if (firstLoad && !offline) {
    firstLoad = false;
    $("#bootText").textContent = S.browser_speech ? "CLICK TO INITIALIZE" : "INITIALIZING";
    if (!S.browser_speech) setTimeout(dismissBoot, 1800);
  }
  setTimeout(poll, 350);
}

/* ----- controls ----- */
const post = (path, body) => fetch(path, { method: "POST", headers: { "Content-Type": "application/json", "X-Jarvis-Token": TOKEN }, body: JSON.stringify(body) }).catch(() => {});
$("#form").addEventListener("submit", e => {
  e.preventDefault();
  const inp = $("#inp"), text = inp.value.trim();
  if (!text) return;
  inp.value = ""; post("/say", { text });
});
$("#yes").onclick = () => post("/confirm", { answer: true });
$("#no").onclick = () => post("/confirm", { answer: false });
$("#boot").addEventListener("click", dismissBoot);
addEventListener("keydown", e => { if (!booted && S.browser_speech) dismissBoot(); });
function tickClock() {
  const d = new Date();
  $("#clock").textContent = d.toLocaleTimeString([], { hour12: false });
  $("#date").textContent = d.toLocaleDateString(undefined, { weekday: "short", day: "2-digit", month: "short", year: "numeric" });
}
setInterval(tickClock, 1000); tickClock();

/* ----- main animation loop ----- */
function frame(t) {
  const st = effective();
  for (let i = 0; i < N; i++) {
    cur[i] += (target(i, t, st) - cur[i]) * .22;
    const len = 4 + cur[i] * 46, b = bars[i];
    b.setAttribute("x2", +b.getAttribute("x1") + dir[i][0] * len);
    b.setAttribute("y2", +b.getAttribute("y1") + dir[i][1] * len);
    b.setAttribute("stroke-opacity", .3 + .7 * cur[i]);
  }
  drawNetwork();
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
poll();
</script>
</body>
